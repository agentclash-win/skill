name: Publish to MCP Registry

# Run by hand after bumping "version" in server.json; the registry refuses a
# version it already has.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # OIDC proves the run belongs to the agentclash-win org, which the device
    # login cannot do, so the io.github.agentclash-win/ name needs no stored token
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the hash is the one in registry_1.8.7_checksums.txt; bump both together
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check
          tar xzf "$archive" mcp-publisher
          rm "$archive"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
